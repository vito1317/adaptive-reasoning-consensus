name: CI

# The two checks that have actually caught defects in this project: the test
# suite, which pins every proposition to an executable counterpart, and the
# artifact cross-check, which catches the failure mode that bit three times --
# prose or a table updated while the JSON it quotes moved, or the reverse.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test suite
        run: python -m pytest -q

  paper-numbers:
    # Runs even if the suite fails: a number drifting and a proposition
    # breaking are independent faults and both should be reported.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Every figure quoted in the paper matches its artifact
        run: python experiments/check_paper_numbers.py

  zh-coverage:
    # A complete Chinese retranslation was written, committed, and then left
    # unreferenced while every consumer kept naming the older condensed file.
    # Nothing failed: the stale edition carried all the headline numbers, so
    # check_paper_numbers passed on it. Prose volume per section is what
    # separates the two.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: The Chinese edition covers the English paper
        run: python experiments/check_zh_coverage.py

  docx-links:
    # The "[n] jumps to the top of the document" defect returned twice and is
    # invisible without an explicit check: the .docx opens fine either way.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Every internal link in the Word exports lands
        run: python experiments/check_docx_links.py
